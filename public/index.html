    <!-- Eco IA Widget -->
    <script src="https://ecoai.fromdoppler.com/eco-ia-widget.iife.js" defer></script>
    <script src="https://ecoai.fromdoppler.com/eco-ia-widget-docked.iife.js" defer></script>
    <script>
      (function () {
        'use strict';

        window.isDockedWidgetOpen = false;

        // Lee el account ID del JWT de dopplerSessionState
        function getAccountId() {
          try {
            var token = window.dopplerSessionState && window.dopplerSessionState.jwtToken;
            if (!token) return null;
            var payload = JSON.parse(atob(token.split('.')[1]));
            return payload.nameid ? String(payload.nameid) : null;
          } catch (e) {
            return null;
          }
        }

        // Crea e inserta el widget
        function insertWidget() {
          var ecoIAEnabled = window.dopplerSessionState.rawDopplerUserData.features.ecoIAEnabled;
          if (!ecoIAEnabled) return;

          var height = 335;
          var ecoAIAddOn = dopplerSessionState.rawDopplerUserData.user.addOnPlans?.filter(
            (aop) => aop.planData?.idAddOnType === 5,
          )[0];
          if (ecoAIAddOn !== undefined && ecoAIAddOn.active) {
            height = 550;
          }

          if (document.getElementById('eco-ia-widget-container')) return;
          var target = document.getElementById('dashboard-eco-ia');
          if (!target) return;
          var accountId = getAccountId();
          if (!accountId) return;

          var container = document.createElement('div');
          container.id = 'eco-ia-widget-container';
          container.style.cssText = [
            'width:100%',
            'height:' + height + 'px',
            'margin-bottom:24px',
            'border-radius:8px',
            'overflow:hidden',
            'box-shadow:0 1px 4px rgba(0,0,0,0.08)',
          ].join(';');

          var widget = document.createElement('eco-ia-widget');
          widget.setAttribute('account-id', accountId);
          widget.style.cssText = 'display:block;width:100%;height:100%;';
          container.appendChild(widget);
          target.parentNode.insertBefore(container, target);
          console.log('[EcoIA] Widget insertado — account ID:', accountId);
        }

        // Espera a que React renderice el dashboard
        function waitForDashboard() {
          if (document.getElementById('dashboard-eco-ia')) {
            insertWidget();
            return;
          }
          var observer = new MutationObserver(function (m, obs) {
            if (document.getElementById('dashboard-eco-ia')) {
              obs.disconnect();
              insertWidget();
            }
          });

          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () {
            observer.disconnect();
          }, 15000);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', waitForDashboard);
        } else {
          waitForDashboard();
        }
      })();
    </script>
    <!-- Fin Eco IA Widget -->
    <!-- Eco IA Widget Docked -->
    <script>
      (function () {
        'use strict';

        var activeWidgetId = null;
        var isClosingChatWidget = false;
        var widgetClosers = {};

        function getAccountId() {
          try {
            var token = window.dopplerSessionState && window.dopplerSessionState.jwtToken;
            if (!token) return null;
            var payload = JSON.parse(atob(token.split('.')[1]));
            return payload.nameid ? String(payload.nameid) : null;
          } catch (e) {
            return null;
          }
        }

        function isVisible(element) {
          if (!element) return false;

          var style = window.getComputedStyle(element);
          return style.display !== 'none' && style.visibility !== 'hidden';
        }

        function isChatWidgetOpen() {
          return isVisible(document.querySelector('body > .controller'));
        }

        function closeChatWidget() {
          if (!isChatWidgetOpen()) return;

          var launcher = document.getElementById('launcher');
          if (!launcher) return;

          isClosingChatWidget = true;
          launcher.click();
          window.setTimeout(function () {
            isClosingChatWidget = false;
          });
        }

        function closeOnboardingWidget() {
          var checklist = document.getElementById('userpilot-checklist');
          if (!isVisible(checklist)) return;

          var closeButton = Array.from(checklist.querySelectorAll('button')).find(
            function (button) {
              return /cerrar|close|minimizar|minimize|dismiss/i.test(
                `${button.getAttribute('aria-label')} ${button.textContent}`,
              );
            },
          );
          closeButton?.click();
        }

        function closeDashboardEcoWidget() {
          var container = document.getElementById('eco-ia-widget-container');
          if (container) {
            container.style.setProperty('display', 'none', 'important');
          }
        }

        function activateWidget(widgetId) {
          Object.entries(widgetClosers).forEach(function ([id, close]) {
            if (id !== widgetId) close();
          });
          activeWidgetId = widgetId;
        }

        function notifyWidgetClosed(widgetId) {
          if (activeWidgetId === widgetId) {
            activeWidgetId = null;
          }
        }

        widgetClosers['eco-ia'] = closeDockedWidget;
        widgetClosers['eco-ia-dashboard'] = closeDashboardEcoWidget;
        widgetClosers.chat = closeChatWidget;
        widgetClosers.onboarding = closeOnboardingWidget;
        window.dopplerWidgets = {
          activate: activateWidget,
          notifyClosed: notifyWidgetClosed,
          register: function (widgetId, close) {
            widgetClosers[widgetId] = close;
          },
        };

        function setDockedLayout(isOpen) {
          window.isDockedWidgetOpen = isOpen;
          document.getElementById('root')?.classList.toggle('eco-ia-docked-open', isOpen);
          document.body.classList.toggle('eco-ia-docked-open', isOpen);
          setExternalLaunchersPosition(isOpen);
        }

        function setExternalLaunchersPosition(isOpen) {
          [
            ['userpilot-checklist', '520px'],
            ['launcher', '440px'],
          ].forEach(function ([id, right]) {
            var launcher = document.getElementById(id);
            if (!launcher) return;

            if (isOpen) {
              if (!launcher.dataset.ecoIaOriginalRight) {
                launcher.dataset.ecoIaOriginalRight = JSON.stringify([
                  launcher.style.getPropertyValue('right'),
                  launcher.style.getPropertyPriority('right'),
                ]);
              }
              if (
                launcher.style.getPropertyValue('right') !== right ||
                launcher.style.getPropertyPriority('right') !== 'important'
              ) {
                launcher.style.setProperty('right', right, 'important');
              }
              return;
            }

            if (launcher.dataset.ecoIaOriginalRight) {
              var [originalRight, originalPriority] = JSON.parse(
                launcher.dataset.ecoIaOriginalRight,
              );
              launcher.style.setProperty('right', originalRight, originalPriority);
              delete launcher.dataset.ecoIaOriginalRight;
            }
          });
        }

        function insertDockedWidget() {
          if (document.querySelector('eco-ia-widget-docked')) return true;

          var accountId = getAccountId();
          var shell = document.getElementById('eco-ia-docked-shell');
          if (!accountId || !shell) return false;

          var widget = document.createElement('eco-ia-widget-docked');
          widget.setAttribute('account-id', accountId);
          widget.addEventListener('ecoia:opened', function () {
            setDockedLayout(true);
          });
          widget.addEventListener('ecoia:closed', function () {
            setDockedLayout(false);
            notifyWidgetClosed('eco-ia');
          });
          shell.appendChild(widget);
          return true;
        }

        function openDockedWidget() {
          if (!insertDockedWidget()) return;

          var widget = document.querySelector('eco-ia-widget-docked');
          if (widget && typeof widget.open === 'function') {
            widget.open();
            setDockedLayout(true);
            return;
          }

          window.customElements.whenDefined('eco-ia-widget-docked').then(function () {
            var upgradedWidget = document.querySelector('eco-ia-widget-docked');
            if (upgradedWidget && typeof upgradedWidget.open === 'function') {
              upgradedWidget.open();
              setDockedLayout(true);
            }
          });
        }

        function closeDockedWidget() {
          var widget = document.querySelector('eco-ia-widget-docked');
          if (widget && typeof widget.close === 'function') {
            widget.close();
          }
        }

        window.addEventListener('ecoia:open-requested', function () {
          if (window.isDockedWidgetOpen) {
            closeDockedWidget();
          } else {
            activateWidget('eco-ia');
            openDockedWidget();
          }
        });

        document.addEventListener(
          'click',
          function (event) {
            var dashboardEcoWidget = event.target.closest('eco-ia-widget');
            var launcher = event.target.closest('#launcher');
            var controller = event.target.closest('.controller');
            var action = event.target.closest('button, a');
            if (dashboardEcoWidget) {
              activateWidget('eco-ia-dashboard');
            }
            if (launcher && !isClosingChatWidget) {
              if (isChatWidgetOpen()) {
                notifyWidgetClosed('chat');
              } else {
                activateWidget('chat');
              }
            }
            if (
              controller?.parentElement === document.body &&
              action &&
              /primeros pasos|get started/i.test(action.textContent)
            ) {
              activateWidget('onboarding');
            }
          },
          true,
        );

        window.addEventListener('ecoia:opened', function () {
          setDockedLayout(true);
        });

        window.addEventListener('ecoia:closed', function () {
          setDockedLayout(false);
          notifyWidgetClosed('eco-ia');
        });

        function waitForSession() {
          new MutationObserver(function () {
            if (document.body.classList.contains('eco-ia-docked-open')) {
              setExternalLaunchersPosition(true);
            }
          }).observe(document.body, {
            attributes: true,
            attributeFilter: ['style'],
            childList: true,
            subtree: true,
          });

          if (insertDockedWidget()) return;

          var attempts = 0;
          var interval = window.setInterval(function () {
            attempts += 1;
            if (insertDockedWidget() || attempts === 150) {
              window.clearInterval(interval);
            }
          }, 100);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', waitForSession);
        } else {
          waitForSession();
        }
      })();
    </script>
